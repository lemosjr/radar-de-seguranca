<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito SSPDS</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/loginHeader.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <header class="header">
        <div class="logo_container">
            <img src="../assets/logotipo_sspds.png" alt="Logomarca da Secretaria da Segurança Pública e Defesa Social"
                class="header_logo">
            <h1>Forças de Segurança de Fortaleza</h1>
        </div>
    </header>

    <main class="login_main_wrapper">
        <div class="auth_container">
            <section class="auth_banner" aria-labelledby="banner_title">
                <div class="banner_content">
                    <img src="../assets/logotipo_sspds.png" alt="Logomarca Governo do Ceará e SSPDS"
                        class="banner_logo_img">

                    <p id="banner_text">Para manter-se conectado de forma segura, por favor faça login com suas
                        credenciais institucionais.</p>
                    <button type="button" id="toggle_btn" class="btn_outline">CRIAR CONTA</button>
                </div>
            </section>

            <section class="auth_forms">

                <form id="form_login" class="form_box active">
                    <h2>Acessar Sistema</h2>

                    <div class="input_group">
                        <label for="login_email" class="sr_only">E-mail Institucional</label>
                        <input type="email" id="login_email" placeholder="E-mail" required>
                    </div>

                    <div class="input_group">
                        <label for="login_password" class="sr_only">Senha de Acesso</label>
                        <input type="password" id="login_password" placeholder="Senha" required>
                    </div>

                    <div class="demo_credentials" aria-label="Credenciais de acesso para a apresentação">
                        <strong>Acesso de Demonstração:</strong>
                        <p>E-mail: <span>admin@sspds.ce.gov.br</span></p>
                        <p>Senha: <span>123456</span></p>
                    </div>

                    <div id="login_error" class="error_msg" aria-live="polite"></div>

                    <button type="submit" class="btn_solid">ENTRAR</button>
                </form>

                <form id="form_register" class="form_box hidden">
                    <h2>Criar Conta</h2>

                    <div class="input_group">
                        <label for="reg_nome" class="sr_only">Nome Completo</label>
                        <input type="text" id="reg_nome" placeholder="Nome Completo" required>
                    </div>

                    <div class="input_group">
                        <label for="reg_email" class="sr_only">E-mail Institucional</label>
                        <input type="email" id="reg_email" placeholder="E-mail" required>
                    </div>

                    <div class="input_group">
                        <label for="reg_password" class="sr_only">Criar Senha</label>
                        <input type="password" id="reg_password" placeholder="Senha" required>
                    </div>

                    <div id="reg_error" class="error_msg" aria-live="polite"></div>

                    <button type="submit" class="btn_solid">CADASTRAR</button>
                </form>

            </section>
        </div>
    </main>

    

    <script src="../js/login.js"></script>
</body>

</html>
