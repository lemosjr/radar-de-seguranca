<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <main class="login_wrapper">
        <section class="login_card">
            <header class="login_header">
                <h2>Acesso ao Painel</h2>
                <p>Insira suas credenciais corporativas</p>
            </header>

            <form action="dashboard.html" method="GET" class="login_form">
                <fieldset>
                    <legend class="sr_only">Dados de Autenticação</legend>
                    
                    <div class="input_group">
                        <label for="user_email">E-mail Institucional</label>
                        <input type="email" id="user_email" name="email" required placeholder="matricula@seguranca.ce.gov.br">
                    </div>

                    <div class="input_group">
                        <label for="user_password">Senha</label>
                        <input type="password" id="user_password" name="password" required placeholder="Sua senha de acesso">
                    </div>
                </fieldset>

                <button type="submit" class="btn_login">Entrar no Sistema</button>
            </form>
        </section>
    </main>
</body>
</html>
